---
layout: default
---

<div id="main" role="main">
  <article class="publication-detail" itemscope itemtype="https://schema.org/ScholarlyArticle">
    <div class="page__inner-wrap">
      <a class="back-link" href="{{ '/publications/' | relative_url }}">← All publications</a>
      <p class="publication-detail__venue"><i class="fas fa-book-open" aria-hidden="true"></i>{{ page.venue }} · {{ page.date | date: "%Y" }}</p>
      <h1 class="publication-detail__title" itemprop="headline">{{ page.title }}</h1>
      <p class="publication-authors" itemprop="author">{{ page.authors }}</p>
      {% if page.author_note %}<p class="publication-note">{{ page.author_note }}</p>{% endif %}
      {% include publication-resources.html publication=page %}
      {% if page.thumbnail %}<figure class="publication-detail__figure"><img src="{{ page.thumbnail }}" alt="{{ page.title }} project overview" loading="lazy"></figure>{% endif %}
    </div>
  </article>
</div>
